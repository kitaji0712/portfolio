<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<title>suyasuya — model comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #08080a; --fg: #f3f2ef; --mute: #9a9aa0; --dim: #5c5c63; --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.18); --accent: #ff5a1f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Geist", "Zen Kaku Gothic New", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 20px clamp(16px, 3vw, 40px); border-bottom: 1px solid var(--line); }
  h1 { font-weight: 500; font-size: clamp(22px, 2.4vw, 32px); letter-spacing: -.04em; }
  header p, .tag, .ctrl button { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--mute); }
  a { color: inherit; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100svh - 70px); }
  .pane { position: relative; border-right: 1px solid var(--line); background: radial-gradient(58% 40% at 50% 74%, rgba(255,255,255,.1), rgba(255,255,255,.03) 55%, transparent 100%); }
  .pane:last-child { border-right: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
  canvas:active { cursor: grabbing; }
  .label { position: absolute; left: clamp(16px, 2.4vw, 32px); top: 22px; z-index: 1; pointer-events: none; }
  .label b { display: block; font-weight: 500; font-size: clamp(20px, 2vw, 28px); letter-spacing: -.035em; }
  .label span { display: block; margin-top: 6px; font-family: "Zen Kaku Gothic New", sans-serif; font-size: 13.5px; line-height: 1.8; color: var(--mute); max-width: 30ch; }
  .tag { display: inline-block; margin-bottom: 10px; color: var(--accent); }
  .ctrl { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
  .ctrl button { height: 34px; padding: 0 14px; border-radius: 8px; border: 0; color: var(--fg); background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px var(--line-2); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; transition: transform 160ms cubic-bezier(.23,1,.32,1); }
  .ctrl button:active { transform: scale(.97); }
  .ctrl button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .pane { min-height: 70svh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>suyasuya — 作り方の比較</h1>
  <p><a href="./">← Portfolio</a></p>
</header>
<div class="grid">
  <section class="pane">
    <div class="label"><span class="tag">A</span><b>Blender で作り直し</b><span>印刷パーツの寸法から輪郭だけ取り、継ぎ目のない滑らかな面で作り直したもの。いまサイトで使っている版。</span></div>
    <canvas data-model="models/suyasuya.glb?v=5"></canvas>
  </section>
  <section class="pane">
    <div class="label"><span class="tag">B</span><b>元の STL（印刷パーツ）</b><span>3D プリントしたパーツをそのまま組み立てたもの。分割線・目の穴・首の切り欠き・面のカクつきもそのまま。</span></div>
    <canvas data-model="models/suyasuya-stl.glb?v=5"></canvas>
  </section>
</div>
<div class="ctrl">
  <button type="button" id="move" aria-pressed="true">Motion</button>
  <button type="button" id="front">Front</button>
</div>
<script type="module" src="js/compare.js?v=5"></script>
</body>
</html>
