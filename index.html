<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* themes: ?theme=noir|yil|stanford|pastel|apple (noir is the default). ?accent= still tunes noir. */
  try {
    const q = new URLSearchParams(location.search), root = document.documentElement;
    const T = { noir: '#08080a', yil: '#f2dd27', stanford: '#f7f4ee', pastel: '#f6f3ee', apple: '#f5f5f7' };
    const t = q.get('theme');
    if (T[t]) {
      root.dataset.theme = t;
      root.dataset.trying = '';
      document.querySelector('meta[name=theme-color]').content = T[t];
      if (t === 'stanford') document.write('<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">');
    }
    const P = { yellow: '242 221 39', lime: '205 255 64', blue: '84 128 255', mint: '72 255 190', mono: '243 242 239' };
    if (P[q.get('accent')]) root.style.setProperty('--accent-rgb', P[q.get('accent')]);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=16">
<script type="importmap">
{ "imports": {
